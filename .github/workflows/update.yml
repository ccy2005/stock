name: 每日更新股票資料

on:
  schedule:
    - cron: "40 10 * * 1-5"   # 台灣 18:40
    - cron: "50 13 * * 1-5"   # 台灣 21:50
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 抓資料
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python update.py
      - name: 有變動才提交
        run: |
          git config user.name "stock-bot"
          git config user.email "stock-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "沒有變動"; exit 0; fi
          git commit -m "data: $(TZ=Asia/Taipei date +'%F %H:%M')"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "推送失敗，重試 $i"; sleep 10
          done
          exit 1
